; ============================================================================
; Settings.ini — configuration skin for Visual Actor.
;
; A small companion skin (activated from the main skin's ⚙ Settings button)
; that exposes every widget control: transparency/opacity, click-through,
; always-on-top, size, server URL, server start/stop, and avatar visibility.
; Writes changes back to Resources/variables.inc and refreshes the main skin.
; ============================================================================

[Rainmeter]
Update=100
AccurateText=1
DynamicWindowSize=1
AlwaysOnTop=1

@IncludeVariables=#@#variables.inc
@IncludeStyles=#@#styles.inc
@IncludeActions=#@#actions.inc

[Metadata]
Name=Visual Actor Settings
Author=JoeProAI
Version=1.0.0
License=MIT

[MeterTitle]
Meter=String
MeterStyle=StyleBar
X=0
Y=0
W=300
H=28
Text=Visual Actor — Settings
StringAlign=Left

[MeterClickThrough]
Meter=String
MeterStyle=StyleButton
X=8
Y=36
Text=Toggle Click-Through (now: #ClickThrough#)
LeftMouseUpAction=[!SetVariable ClickThrough "(1-#ClickThrough#)"][!WriteKeyValue Variables ClickThrough "(1-#ClickThrough#)" "#@#variables.inc"][!Refresh "VisualActor"][!Refresh]

[MeterAlwaysOnTop]
Meter=String
MeterStyle=StyleButton
X=8
Y=8R
Text=Toggle Always-On-Top (now: #AlwaysOnTop#)
LeftMouseUpAction=[!SetVariable AlwaysOnTop "(1-#AlwaysOnTop#)"][!WriteKeyValue Variables AlwaysOnTop "(1-#AlwaysOnTop#)" "#@#variables.inc"][!Refresh "VisualActor"][!Refresh]

[MeterDraggable]
Meter=String
MeterStyle=StyleButton
X=8
Y=8R
Text=Toggle Draggable (now: #Draggable#)
LeftMouseUpAction=[!SetVariable Draggable "(1-#Draggable#)"][!WriteKeyValue Variables Draggable "(1-#Draggable#)" "#@#variables.inc"][!Refresh "VisualActor"]

[MeterGrow]
Meter=String
MeterStyle=StyleButton
X=8
Y=8R
Text=Width + 40  (now: #Width#)
LeftMouseUpAction=[#GrowWidth#]

[MeterShrink]
Meter=String
MeterStyle=StyleButtonGhost
X=10R
Y=r
Text=Width - 40
LeftMouseUpAction=[#ShrinkWidth#]

[MeterOpacity]
Meter=String
MeterStyle=StyleButton
X=8
Y=8r
Text=Opacity + 25  (now: #Opacity#)
LeftMouseUpAction=[#MoreOpaque#]

[MeterOpacityDown]
Meter=String
MeterStyle=StyleButtonGhost
X=10R
Y=r
Text=Opacity - 25
LeftMouseUpAction=[#LessOpaque#]

[MeterStart]
Meter=String
MeterStyle=StyleButton
X=8
Y=8R
Text=▶ Start Server
LeftMouseUpAction=[#LaunchServer#]

[MeterStop]
Meter=String
MeterStyle=StyleButtonGhost
X=10R
Y=r
Text=■ Stop Server
LeftMouseUpAction=[#StopServer#]

[MeterClose]
Meter=String
MeterStyle=StyleButtonGhost
X=8
Y=12R
Text=Close Settings
LeftMouseUpAction=[#CloseSettings#]
