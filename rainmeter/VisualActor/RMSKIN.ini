; ============================================================================
; RMSKIN.ini - Rainmeter skin package metadata.
;
; Consumed by the Rainmeter Skin Packager (and by build_rainmeter_skin.ps1) to
; produce VisualActor.rmskin. Placed at the skin root so the packager bundles
; the VisualActor skin folder, its @Resources, and the PowerShell helpers.
; ============================================================================

[rmskin]
Name=VisualActor
Author=JoeProAI
Version=1.0.0
; Minimum Rainmeter version required (WebView2 host + modern bangs).
MinimumRainmeter=4.5.0
; Minimum Windows version (WebView2 Runtime requires Win10+).
MinimumWindows=10.0
Load=VisualActor\VisualActor.ini
VariableFiles=VisualActor\@Resources\variables.inc

[Variables]
; Header image shown in the installer dialog (optional; icon used if absent).

[Metadata]
Name=Visual Actor
Author=JoeProAI
Version=1.0.0
License=MIT
Information=Local real-time talking avatar. Loads the Visual Actor server (default http://127.0.0.1:8765/rainmeter) in a WebView2 host with transparency, click-through, always-on-top, drag, and resizable controls. Start the local server before loading the skin.
