; ============================================================================
; AlwaysOnTop.ini — toggling always-on-top for the Visual Actor widget.
;
; Loaded/unloaded by the main skin (action #ToggleAlwaysOnTop#). Sets the main
; skin's Z-position to topmost (1) and persists the choice to variables.inc.
; ============================================================================

[Rainmeter]
Update=1000
AlwaysOnTop=1
OnRefreshAction=[!SetVariable AlwaysOnTop "1"][!WriteKeyValue Variables AlwaysOnTop "1" "#@#variables.inc"][!ZPos 1 "VisualActor"]

@IncludeVariables=#@#variables.inc

[Metadata]
Name=Visual Actor — Always On Top
Author=JoeProAI
Version=1.0.0

[MeasureNoop]
Measure=Calc
Formula=1
