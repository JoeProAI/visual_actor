; ============================================================================
; WebViewHost.ini — WebView2 host layer for Visual Actor.
;
; This include defines the WebView2 control that loads the local server URL
; (default http://127.0.0.1:8765/rainmeter). It is @Included by VisualActor.ini
; so the host layer can be maintained independently of the control bar.
;
; Requires the Rainmeter WebView2 plugin (WebView2.dll) and the Microsoft Edge
; WebView2 Runtime. See README "Rainmeter install" / "Troubleshooting".
; ============================================================================

[MeterWebView]
Meter=WebView2
; --- WebView2 plugin meter properties ---
URL=#ServerURL#
X=0
Y=0
W=#Width#
H=#Height#
; Transparent background lets the avatar (drawn on a transparent canvas) float
; over the desktop. Set Transparent=0 in variables.inc for an opaque panel.
Transparent=#Transparent#
; Forward the configured opacity to the WebView2 host alpha.
Alpha=#Opacity#
; Keep the control non-interactive when click-through is on; the control bar
; and Settings skin remain the way to toggle it back.
DisableInput=#ClickThrough#
DynamicVariables=1
