; ============================================================================
; WebViewHost.ini — WebView2 host layer for Visual Actor.
;
; This include defines the WebView2 plugin measure that loads the local server
; URL (default http://127.0.0.1:8765/rainmeter) plus the anchor meter that
; gives the skin window its size. It is @Included by VisualActor.ini so the
; host layer can be maintained independently of the control bar.
;
; Requires the WebView2 Rainmeter plugin (WebView2.dll — bundled in the
; .rmskin package) and the Microsoft Edge WebView2 Runtime (preinstalled on
; Windows 11; installer at https://developer.microsoft.com/microsoft-edge/webview2/).
; ============================================================================

[MeasureWebView]
Measure=Plugin
Plugin=WebView2
URL=#ServerURL#?mode=#WidgetMode#
X=0
Y=0
W=#Width#
H=#Height#
; 0 = interactive, 1 = click-through, 2 = hold CTRL to drag the skin.
Clickthrough=#ClickThrough#
DynamicVariables=1

; Anchor meter: reserves the skin window area the WebView renders over.
; The near-transparent fill keeps the window hit-testable for dragging.
[MeterWebViewAnchor]
Meter=Image
X=0
Y=0
W=#Width#
H=#Height#
SolidColor=0,0,0,1
DynamicVariables=1
