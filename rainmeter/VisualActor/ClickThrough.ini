; ============================================================================
; ClickThrough.ini — toggling click-through for the Visual Actor widget.
;
; Loaded/unloaded by the main skin (action #ToggleClickThrough#). While active
; it forces the skin click-through ON so mouse events pass to the desktop. To
; regain control, deactivate this config from the Settings skin or via the
; Rainmeter context menu (right-click is still captured by the manager).
; ============================================================================

[Rainmeter]
Update=1000
ClickThrough=1
AlwaysOnTop=#AlwaysOnTop#
OnRefreshAction=[!SetVariable ClickThrough "1"][!WriteKeyValue Variables ClickThrough "1" "#@#variables.inc"][!ClickThrough 1 "VisualActor"]

@IncludeVariables=#@#variables.inc

[Metadata]
Name=Visual Actor — Click Through
Author=JoeProAI
Version=1.0.0

[MeasureNoop]
Measure=Calc
Formula=1
