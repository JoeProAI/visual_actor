; ============================================================================
; VisualActor.ini — main Rainmeter skin.
;
; Loads the local Visual Actor server URL through the WebView2 plugin and
; shows a control bar (server start/stop, settings, status) below the widget.
; Supports transparency, click-through, always-on-top, dragging, and
; configurable size — all driven by Resources/variables.inc.
;
; Load order:  Resources/variables.inc -> styles.inc -> actions.inc -> meters.
; ============================================================================

[Rainmeter]
Update=#RefreshMs#
AccurateText=1
DynamicWindowSize=1
; Drag only when click-through is off (Draggable mirrors the variable).
Draggable=#Draggable#
MouseActionCursor=1
; Always-on-top via skin config (1=topmost). Toggled by AlwaysOnTop.ini.
AlwaysOnTop=#AlwaysOnTop#
ClickThrough=#ClickThrough#
OnRefreshAction=[!SetWindowZPosition "#AlwaysOnTop#"][!CommandMeasure MeasureServer "Run"]

@IncludeVariables=#@#variables.inc
@IncludeStyles=#@#styles.inc
@IncludeActions=#@#actions.inc

[Metadata]
Name=Visual Actor
Author=JoeProAI
Information=Local real-time talking avatar via WebView2. Type text -> streaming voice + lip-synced face.
Version=1.0.0
License=MIT

; ---- Server helpers (RunCommand: executed via !CommandMeasure "Run") ----
[MeasureServer]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#check_server.ps1"
State=Hide
OutputType=ANSI
FinishAction=[!UpdateMeter MeterStatus][!Redraw]
UpdateDivider=(#StatusPollMs# / #RefreshMs#)
OnUpdateAction=[!CommandMeasure MeasureServer "Run"]
DynamicVariables=1

[MeasureLaunch]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#launch_server.ps1"
State=Hide
OutputType=ANSI
FinishAction=[!CommandMeasure MeasureServer "Run"][!CommandMeasure MeasureWebView "Reload"]
DynamicVariables=1

[MeasureStop]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#stop_server.ps1"
State=Hide
OutputType=ANSI
FinishAction=[!CommandMeasure MeasureServer "Run"]
DynamicVariables=1

; ---- WebView2 host layer (the avatar "live camera feed") ----
@IncludeWebView=#CURRENTPATH#WebViewHost.ini

; ---- Control bar (sits below the WebView so it stays visible) ----
[MeterControlBar]
Meter=Image
X=0
Y=#Height#
W=#Width#
H=36
SolidColor=12,17,28,220
DynamicVariables=1

[MeterStartBtn]
Meter=String
MeterStyle=StyleButton
X=6
Y=(#Height# + 7)
Text=▶ Start Server
LeftMouseUpAction=[#LaunchServer#]
ToolTipText=Launch the local Visual Actor server
DynamicVariables=1

[MeterStopBtn]
Meter=String
MeterStyle=StyleButtonGhost
X=10R
Y=(#Height# + 7)
Text=■ Stop
LeftMouseUpAction=[#StopServer#]
ToolTipText=Stop the local server
DynamicVariables=1

[MeterSettingsBtn]
Meter=String
MeterStyle=StyleButtonGhost
X=10R
Y=(#Height# + 7)
Text=⚙ Settings
LeftMouseUpAction=[#OpenSettings#]
ToolTipText=Open the Visual Actor settings skin
DynamicVariables=1

[MeterStatus]
Meter=String
MeterStyle=StyleStatus
StringAlign=Right
X=(#Width# - 6)
Y=(#Height# + 10)
Text=Server: [MeasureServer]
DynamicVariables=1
