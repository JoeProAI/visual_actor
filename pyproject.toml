[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-actor"
version = "1.0.0"
description = "Local real-time visual actor: text -> streaming voice + direct (non-diffusion) lip-synced talking avatar under 100ms."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "JoeProAI" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "soundfile>=0.12",
    "psutil>=5.9",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Heavy / hardware-specific runtimes. Lazy-imported at runtime so the core
# system runs on any consumer machine without a GPU. See README "Optional deps".
ml = [
    "torch>=2.2",
    "torchaudio>=2.2",
    "onnxruntime>=1.17",
    "opencv-python>=4.9",
    "mediapipe>=0.10",
    "librosa>=0.10",
    "av>=11.0",
]
voices = [
    "elevenlabs>=1.0",
    "piper-tts>=1.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
visual-actor = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
