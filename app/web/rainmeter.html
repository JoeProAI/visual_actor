<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visual Actor — Rainmeter Widget</title>
  <link rel="stylesheet" href="/static/rainmeter.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="avatar" aria-label="Floating talking head"></canvas>
  <canvas id="avatar3d" aria-hidden="true"></canvas>

  <div id="offline-card" role="status" aria-live="polite">
    <div>
      <div class="offline-title">Server offline</div>
      <div class="offline-copy">The avatar will reconnect automatically.</div>
    </div>
    <button id="reconnect" type="button">Reconnect</button>
  </div>

  <script src="/static/renderer.js"></script>
  <script src="/static/arcreactor.js"></script>
  <script src="/static/avatar3d.js"></script>
  <script src="/static/rainmeter.js"></script>
</body>
</html>
