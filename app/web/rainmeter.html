<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visual Actor — Rainmeter Widget</title>
  <link rel="stylesheet" href="/static/rainmeter.css" />
</head>
<body>
  <canvas id="avatar" width="480" height="640"></canvas>

  <div id="bar">
    <input id="text" type="text" placeholder="Say something…" />
    <button id="say">Speak</button>
  </div>

  <div id="offline">
    <div>Visual Actor server is offline.</div>
    <button id="reconnect">Reconnect</button>
  </div>

  <script src="/static/rainmeter.js"></script>
</body>
</html>
